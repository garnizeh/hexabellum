[workspace]
members = [
    "crates/protocol",
    "crates/core",
    "crates/server",
    "crates/wasm",
]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2024"
authors = ["Hexabellum Team"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.43", features = ["full"] }
tracing = "0.1.41"
blake3 = "1.5.5"
uuid = { version = "1.12", features = ["v4", "serde"] }
